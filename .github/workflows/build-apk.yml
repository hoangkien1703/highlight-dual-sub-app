name: Build preview APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Test caption engine
        run: node --test tests/caption-engine.test.cjs

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build preview APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify package and number preview APK
        id: package
        env:
          PREVIEW_BUILD: ${{ github.run_number }}
        run: |
          package_line="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 1)"
          echo "$package_line"
          if [[ "$package_line" != *"name='com.kienhoang.highlightdualsub.preview'"* ]]; then
            echo "Unexpected preview package id" >&2
            exit 1
          fi
          apk_name="Highlight-Dual-Sub-Lab-preview-${PREVIEW_BUILD}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Upload numbered preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: Highlight-Dual-Sub-Lab-preview-${{ github.run_number }}
          path: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish numbered preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: Highlight Dual Sub Lab Preview #${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            Preview build #${{ github.run_number }} from `main`.

            Package: `com.kienhoang.highlightdualsub.preview`
            Commit: `${{ github.sha }}`

            Preview APK filenames now include the GitHub Actions build number so newer test builds are easy to identify.
          files: |
            ${{ steps.package.outputs.apk_name }}
            ${{ steps.package.outputs.apk_name }}.sha256
